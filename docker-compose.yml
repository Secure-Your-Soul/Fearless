services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${UID:-1000}
        HOST_GID: ${GID:-1000}
    image: fearless-builder:latest
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/build
    working_dir: /build
    command: ["make"]