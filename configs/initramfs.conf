# ==============================================================================
# FEARINIT - HARDENED KERNEL CONFIGURATION FOR INITRAMFS & EMBEDDED BOOTSTRAP
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. KERNEL DEBUGGING & DIAGNOSTICS
# ------------------------------------------------------------------------------

# Enables general kernel debugging subsystems. Required for dependent debug flags.
CONFIG_DEBUG_KERNEL=y

# Generates debug symbols inside the kernel binary (vmlinux) for backtrace & crash analysis.
CONFIG_DEBUG_INFO=y

# Forces DWARF4 format for debug symbols (ensures compatibility with GDB while keeping size lower).
CONFIG_DEBUG_INFO_DWARF4=y

# Enables the in-kernel symbol table (translates raw memory addresses to human-readable function names in stack traces).
CONFIG_KALLSYMS=y

# Expands the kallsyms table to include all symbols (including local/non-exported functions).
CONFIG_KALLSYMS_ALL=y

# Forces stack frame pointer generation in CPU registers; essential for precise stack unwinding on Panic / GPF.
CONFIG_FRAME_POINTER=y

# Memory protection check: warns during boot if any kernel memory area is simultaneously Writable and Executable (W^X).
CONFIG_DEBUG_WX=y

# Enables the Magic SysRq Key (allows direct kernel interaction via tty/keycombo for emergency reboot, re-mount, etc.).
CONFIG_MAGIC_SYSRQ=y


# ------------------------------------------------------------------------------
# 2. VIRTUAL FILE SYSTEMS (DEVTMPFS & TMPFS)
# ------------------------------------------------------------------------------

# Creates an in-kernel virtual /dev filesystem populated automatically by device drivers during boot.
CONFIG_DEVTMPFS=y

# Automatically mounts /dev at boot (enables PID 1 to immediately access nodes like /dev/console, /dev/null).
CONFIG_DEVTMPFS_MOUNT=y

# Enables temporary in-memory filesystem support (tmpfs) — required for mounting volatile runtime structures.
CONFIG_TMPFS=y


# ------------------------------------------------------------------------------
# 3. UEFI BOOTLOADER INTEGRATION (EFI STUB)
# ------------------------------------------------------------------------------

# Enables general EFI/UEFI infrastructure support within the kernel.
CONFIG_EFI=y

# Converts the kernel image (bzImage) into a native UEFI executable (PE/COFF), allowing UEFI firmware to boot the kernel DIRECTLY without GRUB or systemd-boot.
CONFIG_EFI_STUB=y


# ------------------------------------------------------------------------------
# 4. BUILT-IN INITRAMFS (EMBEDDED CPIO ARCHIVE)
# ------------------------------------------------------------------------------

# Path to the directory or cpio archive that will be linked DIRECTLY INTO THE KERNEL IMAGE (no external initrd required).
CONFIG_INITRAMFS_SOURCE="/build/initramfs"


# ------------------------------------------------------------------------------
# 5. BUILT-IN KERNEL COMMAND LINE
# ------------------------------------------------------------------------------

# Default kernel parameter string:
# - console=ttyS0: Redirects output to serial port COM1 (for QEMU -nographic).
# - ignore_loglevel: Disables log filtering — prints EVERYTHING to serial console.
# - earlyprintk=serial,ttyS0,115200: Prints boot messages BEFORE full TTY drivers initialize (catches early boot panics).
# - debug / loglevel=8: Maximum verbosity level for dmesg output.
# - initcall_debug: Prints execution timing and status for every internal kernel init function.
CONFIG_CMDLINE="console=ttyS0 ignore_loglevel earlyprintk=serial,ttyS0,115200 debug initcall_debug loglevel=8"

# Activates the built-in command line string.
CONFIG_CMDLINE_BOOL=y

# OVERRIDES bootloader parameters — forces the kernel to ignore CMDLINE passed by QEMU/GRUB and strictly use CONFIG_CMDLINE.
CONFIG_CMDLINE_OVERRIDE=y


# ------------------------------------------------------------------------------
# 6. EXECUTABLE FORMATS & SECURITY HARDENING (ASLR / EXEC)
# ------------------------------------------------------------------------------

# Enables support for executing standard ELF binaries (required for FearInit execution).
CONFIG_BINFMT_ELF=y

# Allows generation of ELF core dumps upon process crash.
CONFIG_ARCH_HAS_ELF_CORE=y

# Enables KASLR (Kernel Address Space Layout Randomization) — randomizes kernel base address on every boot to mitigate memory exploits.
CONFIG_RANDOMIZE_BASE=y

# Enables legacy heap (brk) alignment for backward compatibility.
# NOTE: Setting 'y' WEAKENS heap ASLR randomization. For maximum security, disable this (# CONFIG_COMPAT_BRK is not set).
CONFIG_COMPAT_BRK=y