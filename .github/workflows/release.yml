name: Release

env:
  REPOSITORY_NAME: ${{ github.event.repository.name }}

on:
  push:
    branches: [ stable ]
  pull_request:
    branches: [ stable ]
  merge_group:

permissions:
  contents: read
  packages: write
  checks: write
  statuses: write

jobs:
  check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get Version
        id: ver
        run: |
          V=$(make -s var-VERSION | cut -d= -f2 | sed 's/^v//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Detected version: $V"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "is_new=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.ver.outputs.version }} already exists. Skipping build and release."
          else
            echo "is_new=true" >> $GITHUB_OUTPUT
            echo "New version v${{ steps.ver.outputs.version }} detected. Proceeding with build."
          fi

  build:
    needs: [check]
    if: |
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/stable' && needs.check.outputs.is_new == 'true') ||
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group'
      )

    continue-on-error: ${{ matrix.experimental == true }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        # --- x86_64 ---
          - target: x86_64-unknown-linux-musl
            cpu: x86-64
            name: x86_64
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v2
            name: x86_64-v2
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v3
            name: x86_64-v3
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v4
            name: x86_64-v4

        # --- aarch64 ---
          - target: aarch64-unknown-linux-musl
            cpu: generic
            name: aarch64
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a34
            name: aarch64-cortex-a34
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a35
            name: aarch64-cortex-a35
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a53
            name: aarch64-cortex-a53
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a55
            name: aarch64-cortex-a55
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a57
            name: aarch64-cortex-a57
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a72
            name: aarch64-cortex-a72
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a73
            name: aarch64-cortex-a73
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a75
            name: aarch64-cortex-a75
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a76
            name: aarch64-cortex-a76
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a510
            name: aarch64-cortex-a510
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a710
            name: aarch64-cortex-a710
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-a715
            name: aarch64-cortex-a715
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-x1
            name: aarch64-cortex-x1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: cortex-x2
            name: aarch64-cortex-x2
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-n1
            name: aarch64-neoverse-n1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-n2
            name: aarch64-neoverse-n2
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-v1
            name: aarch64-neoverse-v1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: neoverse-e1
            name: aarch64-neoverse-e1
            experimental: true
          - target: aarch64-unknown-linux-musl
            cpu: apple-m1
            name: aarch64-apple-m1
            experimental: true

        # --- riscv64 ---
          - target: riscv64gc-unknown-linux-musl
            cpu: generic
            name: riscv64
            experimental: true
          - target: riscv64gc-unknown-linux-musl
            cpu: sifive-u54
            name: riscv64-sifive-u54
            experimental: true
          - target: riscv64gc-unknown-linux-musl
            cpu: sifive-u74
            name: riscv64-sifive-u74
            experimental: true

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: fearless:latest
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Run make
        run: |
          echo "UID=$(id -u)" > .env
          echo "GID=$(id -g)" >> .env
          make KERNEL_MARCH=${{ matrix.kernel_march }}
        env:
          DOCKER_BUILDKIT: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.REPOSITORY_NAME }}-${{ matrix.name }}
          path: output/*.iso
          retention-days: 7
          
  release:
    needs: [check, build]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/stable' &&
      needs.check.outputs.is_new == 'true' &&
      needs.build.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create Tag
        run: |
          TAG="v${{ needs.check.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.check.outputs.version }}"
          git push origin "v${{ needs.check.outputs.version }}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.check.outputs.version }}
          files: |
            artifacts/**
          generate_release_notes: true
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
